<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scholo Runs">
<title>Scholomance Runs</title>
<style>
:root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { margin:0; background:#0f0f10; color:#fff; }
.wrap { max-width:760px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
h1 { font-size:26px; margin:8px 0 4px; }
.sub { color:#a7a7ad; margin-bottom:16px; }
.summary { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.card { background:#1b1b1e; border-radius:16px; padding:14px; }
.big { font-size:22px; font-weight:700; margin-top:4px; }
.newrun { width:100%; border:0; border-radius:18px; padding:18px; font-size:22px; font-weight:800; background:#f2f2f2; color:#111; margin-bottom:14px; }
.form { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
.field { background:#1b1b1e; border-radius:14px; padding:10px; }
label { display:block; font-size:12px; color:#aaa; margin-bottom:6px; }
input { width:100%; box-sizing:border-box; border:0; border-radius:10px; padding:12px; font-size:18px; background:#2a2a2e; color:white; }
.actions { display:flex; gap:10px; margin-bottom:18px; }
.actions button { flex:1; border:0; border-radius:12px; padding:13px; font-weight:700; }
.save { background:#fff; color:#111; }
.clear { background:#2a2a2e; color:#fff; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { padding:10px 6px; border-bottom:1px solid #2b2b2f; text-align:center; }
th { color:#aaa; font-weight:600; position:sticky; top:0; background:#0f0f10; }
.small { font-size:12px; color:#aaa; }
.delete { background:none; border:0; color:#ff6b6b; font-size:18px; }
@media (max-width:520px){
  .summary { grid-template-columns:1fr; }
  .form { grid-template-columns:repeat(2,1fr); }
  table { font-size:12px; }
  th, td { padding:9px 3px; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Scholomance Runs</h1>
  <div class="sub">Трекер фарма</div>

  <div class="summary">
    <div class="card"><div class="small">Сегодня</div><div class="big" id="goldToday">0g 0s 0c</div></div>
    <div class="card"><div class="small">Dark Runes сегодня</div><div class="big" id="runesToday">0</div></div>
  </div>

  <button class="newrun" id="newRun">+ Новый ран</button>

  <div class="form">
    <div class="field"><label>Gold</label><input id="gold" inputmode="numeric" type="number" min="0" value="0"></div>
    <div class="field"><label>Silver</label><input id="silver" inputmode="numeric" type="number" min="0" value="0"></div>
    <div class="field"><label>Copper</label><input id="copper" inputmode="numeric" type="number" min="0" value="0"></div>
    <div class="field"><label>Dark Runes</label><input id="runes" inputmode="numeric" type="number" min="0" value="0"></div>
  </div>

  <div class="actions">
    <button class="clear" id="reset">Сбросить всё</button>
  </div>

  <div class="card" style="padding:0 10px 10px; overflow:auto;">
    <table>
      <thead>
        <tr><th>№</th><th>Время</th><th>G</th><th>S</th><th>C</th><th>Runes</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const KEY = 'scholo_runs_v1';
let runs = JSON.parse(localStorage.getItem(KEY) || '[]');

function saveAll(){ localStorage.setItem(KEY, JSON.stringify(runs)); render(); }

function nowLocal(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return {
    iso: d.toISOString(),
    date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
    time: `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`
  };
}

function render(){
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  runs.slice().reverse().forEach((r, idxRev) => {
    const idx = runs.length - idxRev;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${idx}</td><td>${r.time}</td><td>${r.gold}</td><td>${r.silver}</td><td>${r.copper}</td><td>${r.runes}</td><td><button class="delete" data-id="${r.id}">×</button></td>`;
    tr.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete')) return;
    });
    tbody.appendChild(tr);
  });
  document.querySelectorAll('.delete').forEach(btn => btn.onclick = (e) => {
    e.stopPropagation();
    runs = runs.filter(r => r.id !== Number(btn.dataset.id));
    saveAll();
  });

  const today = nowLocal().date;
  let totalCopper = 0, totalRunes = 0;
  runs.filter(r => r.date === today).forEach(r => {
    totalCopper += (Number(r.gold)||0)*10000 + (Number(r.silver)||0)*100 + (Number(r.copper)||0);
    totalRunes += Number(r.runes)||0;
  });
  const g = Math.floor(totalCopper/10000);
  const s = Math.floor((totalCopper%10000)/100);
  const c = totalCopper%100;
  goldToday.textContent = `${g}g ${s}s ${c}c`;
  runesToday.textContent = totalRunes;
}

newRun.onclick = () => {
  const n = nowLocal();
  const id = Date.now();
  runs.push({
    id,
    date: n.date,
    time: n.time,
    gold: Math.max(0, Number(gold.value)||0),
    silver: Math.max(0, Number(silver.value)||0),
    copper: Math.max(0, Number(copper.value)||0),
    runes: Math.max(0, Number(runes.value)||0)
  });
  gold.value = 0; silver.value = 0; copper.value = 0; runes.value = 0;
  saveAll();
};

reset.onclick = () => {
  if(confirm('Удалить всю историю ранов?')) {
    runs = [];
    saveAll();
  }
};

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
