<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scholo Runs">
<title>Scholomance Runs</title>
<style>
:root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { margin:0; background:#0f0f10; color:#fff; }
.wrap { max-width:760px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
h1 { font-size:26px; margin:8px 0 4px; }
.sub { color:#a7a7ad; margin-bottom:16px; }
.summary { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.card { background:#1b1b1e; border-radius:16px; padding:14px; }
.big { font-size:22px; font-weight:700; margin-top:4px; }
.form { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
.field { background:#1b1b1e; border-radius:14px; padding:10px; }
label { display:block; font-size:12px; color:#aaa; margin-bottom:6px; }
input { width:100%; box-sizing:border-box; border:0; border-radius:10px; padding:12px; font-size:18px; background:#2a2a2e; color:white; }
.newrun { width:100%; border:0; border-radius:18px; padding:18px; font-size:22px; font-weight:800; background:#f2f2f2; color:#111; margin-bottom:14px; }
.actions { display:flex; gap:10px; margin-bottom:18px; }
.actions button { flex:1; border:0; border-radius:12px; padding:13px; font-weight:700; }
.clear { background:#2a2a2e; color:#fff; }
.status { min-height:20px; margin:-4px 0 12px; color:#a7a7ad; font-size:13px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { padding:10px 6px; border-bottom:1px solid #2b2b2f; text-align:center; }
th { color:#aaa; font-weight:600; position:sticky; top:0; background:#0f0f10; }
.small { font-size:12px; color:#aaa; }
.delete { background:none; border:0; color:#ff6b6b; font-size:18px; }
@media (max-width:520px){
  .summary { grid-template-columns:1fr; }
  .form { grid-template-columns:repeat(2,1fr); }
  table { font-size:12px; }
  th, td { padding:9px 3px; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Scholomance Runs</h1>
  <div class="sub">Трекер фарма</div>

  <div class="summary">
    <div class="card"><div class="small">Сегодня</div><div class="big" id="goldToday">0g 0s 0c</div></div>
    <div class="card"><div class="small">Dark Runes сегодня</div><div class="big" id="runesToday">0</div></div>
  </div>

  <div class="form">
    <div class="field"><label for="gold">Gold</label><input id="gold" inputmode="numeric" type="number" min="0" step="1" value="0"></div>
    <div class="field"><label for="silver">Silver</label><input id="silver" inputmode="numeric" type="number" min="0" step="1" value="0"></div>
    <div class="field"><label for="copper">Copper</label><input id="copper" inputmode="numeric" type="number" min="0" step="1" value="0"></div>
    <div class="field"><label for="runes">Dark Runes</label><input id="runes" inputmode="numeric" type="number" min="0" step="1" value="0"></div>
  </div>

  <button class="newrun" id="newRun" type="button">+ Новый ран</button>
  <div class="status" id="status" aria-live="polite"></div>

  <div class="actions">
    <button class="clear" id="reset" type="button">Сбросить всё</button>
  </div>

  <div class="card" style="padding:0 10px 10px; overflow:auto;">
    <table>
      <thead><tr><th>№</th><th>Время</th><th>G</th><th>S</th><th>C</th><th>Runes</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
(() => {
  'use strict';

  const KEY = 'scholo_runs_v2';

  const el = {
    newRun: document.getElementById('newRun'),
    reset: document.getElementById('reset'),
    gold: document.getElementById('gold'),
    silver: document.getElementById('silver'),
    copper: document.getElementById('copper'),
    runes: document.getElementById('runes'),
    rows: document.getElementById('rows'),
    goldToday: document.getElementById('goldToday'),
    runesToday: document.getElementById('runesToday'),
    status: document.getElementById('status')
  };

  let runs = [];
  try {
    const saved = localStorage.getItem(KEY);
    runs = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(runs)) runs = [];
  } catch (_) {
    runs = [];
  }

  function n(value) {
    const v = parseInt(value, 10);
    return Number.isFinite(v) && v > 0 ? v : 0;
  }

  function nowLocal() {
    const d = new Date();
    const pad = x => String(x).padStart(2, '0');
    return {
      date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
      time: `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`
    };
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(runs));
    } catch (_) {
      el.status.textContent = 'Не удалось сохранить данные в памяти браузера.';
    }
  }

  function render() {
    el.rows.innerHTML = '';

    runs.slice().reverse().forEach((r, idxRev) => {
      const idx = runs.length - idxRev;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${idx}</td><td>${r.time}</td><td>${r.gold}</td><td>${r.silver}</td><td>${r.copper}</td><td>${r.runes}</td><td><button class="delete" type="button" data-id="${r.id}" aria-label="Удалить ран">×</button></td>`;
      el.rows.appendChild(tr);
    });

    const today = nowLocal().date;
    let totalCopper = 0;
    let totalRunes = 0;

    for (const r of runs) {
      if (r.date !== today) continue;
      totalCopper += n(r.gold) * 10000 + n(r.silver) * 100 + n(r.copper);
      totalRunes += n(r.runes);
    }

    const g = Math.floor(totalCopper / 10000);
    const s = Math.floor((totalCopper % 10000) / 100);
    const c = totalCopper % 100;
    el.goldToday.textContent = `${g}g ${s}s ${c}c`;
    el.runesToday.textContent = String(totalRunes);
  }

  el.newRun.addEventListener('click', () => {
    const stamp = nowLocal();
    const run = {
      id: Date.now(),
      date: stamp.date,
      time: stamp.time,
      gold: n(el.gold.value),
      silver: n(el.silver.value),
      copper: n(el.copper.value),
      runes: n(el.runes.value)
    };

    runs.push(run);
    persist();
    render();

    el.status.textContent = `Записано: ${run.gold}g ${run.silver}s ${run.copper}c, рун: ${run.runes}`;
    el.gold.value = '0';
    el.silver.value = '0';
    el.copper.value = '0';
    el.runes.value = '0';
  });

  el.rows.addEventListener('click', (event) => {
    const button = event.target.closest('.delete');
    if (!button) return;
    const id = Number(button.dataset.id);
    runs = runs.filter(r => r.id !== id);
    persist();
    render();
  });

  el.reset.addEventListener('click', () => {
    if (!confirm('Удалить всю историю ранов?')) return;
    runs = [];
    persist();
    render();
    el.status.textContent = 'История очищена.';
  });

  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(() => {});
  }
})();
</script>
</body>
</html>
